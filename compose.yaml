# Marquee — pulls the published image and runs it alongside Postgres.
#
#   docker compose up -d                          # start
#   docker compose pull && docker compose up -d   # update
#
# This file plus a filled-in .env is a complete install; no checkout needed.
# Pin a release with MARQUEE_TAG=2.2 in .env. To build from source instead,
# add the compose.build.yaml override.

# Pin the project + volume names so they don't depend on the install
# directory. Moving the compose file between hosts/paths keeps the
# Postgres data volume (`marquee_pgdata`) discoverable.
name: marquee

services:
  postgres:
    image: postgres:16-alpine@sha256:4e6e670bb069649261c9c18031f0aded7bb249a5b6664ddec29c013a89310d50
    container_name: marquee-postgres
    restart: unless-stopped
    env_file: ./.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-marqueeadmin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required in .env}
      POSTGRES_DB: ${POSTGRES_DB:-marquee}
    volumes:
      - marquee_pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-marqueeadmin} -d ${POSTGRES_DB:-marquee}"]
      interval: 10s
      timeout: 5s
      retries: 5

  marquee:
    image: ghcr.io/ijoshi129/marquee:${MARQUEE_TAG:-latest}
    container_name: marquee
    restart: unless-stopped
    env_file: ./.env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-marqueeadmin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-marquee}
      BACKUP_DIR: ${BACKUP_DIR:-/backups}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
    volumes:
      - ${BACKUP_HOST_PATH:-./backups}:/backups
      - ./.env:/app/.env
    ports:
      - "${APP_HOST_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  marquee_pgdata:
    name: marquee_pgdata
