# Marquee — builds the image from this checkout and runs it.
#
#   docker compose up -d --build   # start / apply updates
#
# Updating: `git pull && docker compose up -d --build`. No registry round-trip;
# the image is built on the host from whatever's in the working tree.

# Pin the project + volume names so they don't depend on the install
# directory. Moving the compose file between hosts/paths keeps the
# Postgres data volume (`marquee_pgdata`) discoverable.
name: marquee

services:
  postgres:
    image: postgres:16-alpine@sha256:4e6e670bb069649261c9c18031f0aded7bb249a5b6664ddec29c013a89310d50
    container_name: marquee-postgres
    restart: unless-stopped
    env_file: ./.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-marqueeadmin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required in .env}
      POSTGRES_DB: ${POSTGRES_DB:-marquee}
    volumes:
      - marquee_pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-marqueeadmin} -d ${POSTGRES_DB:-marquee}"]
      interval: 10s
      timeout: 5s
      retries: 5

  marquee:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: marquee:local
    container_name: marquee
    restart: unless-stopped
    env_file: ./.env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-marqueeadmin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-marquee}
      BACKUP_DIR: ${BACKUP_DIR:-/backups}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
    volumes:
      - ${BACKUP_HOST_PATH:-./backups}:/backups
    ports:
      - "${APP_HOST_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  marquee_pgdata:
    name: marquee_pgdata
