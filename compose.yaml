# Marquee — pulls the prebuilt image from GHCR and runs it.
#
#   docker compose --env-file .env up -d   # start
#   docker compose --env-file .env pull    # fetch newer image
#   docker compose --env-file .env up -d   # apply

services:
  postgres:
    image: postgres:16-alpine@sha256:4e6e670bb069649261c9c18031f0aded7bb249a5b6664ddec29c013a89310d50
    container_name: marquee-postgres
    restart: unless-stopped
    env_file: ./.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-marqueeadmin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required in .env}
      POSTGRES_DB: ${POSTGRES_DB:-marquee}
    volumes:
      - marquee_pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-marqueeadmin} -d ${POSTGRES_DB:-marquee}"]
      interval: 10s
      timeout: 5s
      retries: 5

  marquee:
    image: ghcr.io/ijoshi129/marquee:latest
    # Always check the registry for a newer :latest on `docker compose up`,
    # so updates are picked up without an explicit `docker compose pull`.
    pull_policy: always
    container_name: marquee
    restart: unless-stopped
    env_file: ./.env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-marqueeadmin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-marquee}
      BACKUP_DIR: ${BACKUP_DIR:-/backups}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
    volumes:
      - ${BACKUP_HOST_PATH:-./backups}:/backups
    ports:
      - "${APP_HOST_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  marquee_pgdata:
