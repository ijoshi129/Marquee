name: build-and-publish

# Builds the marquee container image and publishes to GitHub Container
# Registry (GHCR) on every push to main and every semver tag (v*).
#
# After the first push to main lands, make the package public manually:
#   GitHub → your profile → Packages → marquee → Settings → Visibility = Public
# Otherwise users hitting `docker pull ghcr.io/ijoshi129/marquee` will get a
# 401 unless they're signed in.
#
# Tagging convention emitted per build:
#   :latest         — every main push (latest known-good)
#   :sha-abc1234    — every build, for traceability
#   :0.2.0, :0.2    — only on git tags like v0.2.0 (semver-parsed)
#
# Cache is keyed on GitHub Actions cache so layer reuse drops a typical
# build from ~5 min cold to ~30 s warm.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # Lowercase owner; GHCR rejects uppercase paths.
          images: ghcr.io/${{ github.repository_owner }}/marquee
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
